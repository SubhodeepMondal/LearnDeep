name: C++ CI

on:
  push:
    branches: [ master]
  pull_request:
    branches: [ master ]

jobs:
  test_cpu_avx:
    strategy:
      fail-fast: false
      matrix:
        kernel: [CPU, AVX2]

    runs-on: ubuntu-latest

    env:
      DL_KERNEL: ${{ matrix.kernel }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure
        run: cmake --preset release_cpu

      - name: Build
        run: cmake --build --preset release_cpu -- -j$(nproc)

      - name: Test
        run: ctest --preset release_cpu -R unit_test --output-on-failure


  test_cuda:
    runs-on: [self-hosted, linux, x64, gpu]

    env:
      DL_KERNEL: CUDA

    steps:
      - uses: actions/checkout@v4

      - name: Check GPU
        run: nvidia-smi

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default -- -j$(nproc)

      - name: Test
        run: ctest --preset default -R unit_test --output-on-failure
