name: C++ CI

on:
  push:
    branches: [ master]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        kernel: [CPU, AVX2]

    env:
      DL_KERNEL: ${{ matrix.kernel }}

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default -- -j$(nproc)

      - name: Run unit tests
        run: ctest --test-dir build -R unit_test --output-on-failure