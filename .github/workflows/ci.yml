name: C++ CI

on:
  push:
    branches: [ master]
  pull_request:
    branches: [ master ]

jobs:
  test_cuda:
    runs-on: [self-hosted, linux, x64, gpu]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GPU
        run: nvidia-smi

      - name: Configure
        env:
          DL_KERNEL: CUDA
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default -- -j$(nproc)

      - name: Run unit tests
        env:
          DL_KERNEL: CUDA
        run: ctest --test-dir build -R unit_test --output-on-failure